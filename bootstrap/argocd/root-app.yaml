# App-of-apps: the only object applied by hand. Everything else is reconciled from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source: { repoURL: https://github.com/momosto/insurehub-platform, targetRevision: main, path: clusters/demo/applications }
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy: { automated: { prune: true, selfHeal: true } }
