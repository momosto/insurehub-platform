# Adds the KSOPS binary and the age private key (Secret "sops-age", created once by scripts/bootstrap-cluster.sh)
apiVersion: apps/v1
kind: Deployment
metadata: { name: argocd-repo-server }
spec:
  template:
    spec:
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.3.2
          command: ["/bin/sh", "-c"]
          args: ["cp ksops kustomize /custom-tools/"]
          volumeMounts: [{ name: custom-tools, mountPath: /custom-tools }]
      containers:
        - name: argocd-repo-server
          env:
            - { name: XDG_CONFIG_HOME, value: /.config }
            - { name: SOPS_AGE_KEY_FILE, value: /.config/sops/age/keys.txt }
          volumeMounts:
            - { name: custom-tools, mountPath: /usr/local/bin/kustomize, subPath: kustomize }
            - { name: custom-tools, mountPath: /usr/local/bin/ksops, subPath: ksops }
            - { name: sops-age, mountPath: /.config/sops/age }
      volumes:
        - { name: custom-tools, emptyDir: {} }
        - { name: sops-age, secret: { secretName: sops-age } }
