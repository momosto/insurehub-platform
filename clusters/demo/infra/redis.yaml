# Sessions for InsureAssist (db 2) and USSD (db 3). AOF on: USSD PIN hashes live here (insurehub-ussd ADR-0003).
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: data, labels: { app.kubernetes.io/name: redis } }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: data, labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: insurehub } }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: insurehub } }
    spec:
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources: { requests: { cpu: 25m, memory: 96Mi }, limits: { memory: 160Mi } }
          securityContext: { runAsUser: 999, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
