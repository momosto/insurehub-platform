# Shared broker: topic exchange insurehub.events (ecosystem event catalogue §6). Queues are declared by consumers.
apiVersion: v1
kind: ConfigMap
metadata: { name: rabbitmq-config, namespace: data }
data:
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
    vm_memory_high_watermark.absolute = 400MB
    disk_free_limit.absolute = 1GB
    management.tcp.port = 15672
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
  definitions.json: |
    {
      "vhosts": [{ "name": "/" }],
      "exchanges": [
        { "name": "insurehub.events", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false, "internal": false, "arguments": {} }
      ]
    }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: data, labels: { app.kubernetes.io/name: rabbitmq } }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
    - { name: prometheus, port: 15692 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rabbitmq, namespace: data, labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: insurehub } }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: rabbitmq } }
  template:
    metadata: { labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: insurehub } }
    spec:
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13.7-alpine
          envFrom: [{ secretRef: { name: rabbitmq-credentials } }]   # RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: prometheus, containerPort: 15692 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 512Mi } }
          securityContext: { runAsUser: 999, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }, periodSeconds: 15, timeoutSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf }
            - { name: config, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins }
            - { name: config, mountPath: /etc/rabbitmq/definitions.json, subPath: definitions.json }
      volumes: [{ name: config, configMap: { name: rabbitmq-config } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
