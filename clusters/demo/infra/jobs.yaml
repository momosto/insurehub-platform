# PF-09 nightly backup to object storage (RPO 24 h) and PF-12 nightly demo reset. Times are Africa/Harare.
apiVersion: batch/v1
kind: CronJob
metadata: { name: postgres-backup, namespace: data }
spec:
  schedule: "15 1 * * *"
  timeZone: Africa/Harare
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { runAsNonRoot: true, runAsUser: 70, seccompProfile: { type: RuntimeDefault } }
          volumes: [{ name: dumps, emptyDir: {} }]
          initContainers:
            - name: dump
              image: postgres:16.6-alpine
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: postgres }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  for db in insurehub payments notifications claimguard lendhub insureassist; do
                    pg_dump --format=custom --dbname="$db" > "/dumps/$db.dump"
                  done
                  date -u +%s > /dumps/last-success
              volumeMounts: [{ name: dumps, mountPath: /dumps }]
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          containers:
            - name: upload
              image: amazon/aws-cli:2.22.35
              envFrom: [{ secretRef: { name: backup-storage } }]   # S3_ENDPOINT, BACKUP_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
              env: [{ name: HOME, value: /tmp }]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  stamp=$(date -u +%Y-%m-%dT%H%MZ)
                  aws s3 cp /dumps "s3://$BACKUP_BUCKET/postgres/$stamp/" --recursive --exclude last-success --endpoint-url "$S3_ENDPOINT" --only-show-errors
                  # heartbeat object: the "backup missing" alert checks its age
                  aws s3 cp /dumps/last-success "s3://$BACKUP_BUCKET/postgres/last-success" --endpoint-url "$S3_ENDPOINT" --only-show-errors
                  echo "backup $stamp uploaded"
              volumeMounts: [{ name: dumps, mountPath: /dumps, readOnly: true }]
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              securityContext: { runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
# Nightly demo reset: drop and recreate the demo databases, then restart the apps so they re-run migrations and seeds.
apiVersion: v1
kind: ServiceAccount
metadata: { name: demo-reset, namespace: data }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: demo-reset }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: demo-reset }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: demo-reset }
subjects: [{ kind: ServiceAccount, name: demo-reset, namespace: data }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: demo-reset, namespace: data }
spec:
  schedule: "0 2 * * *"
  timeZone: Africa/Harare
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: demo-reset
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 70, seccompProfile: { type: RuntimeDefault } }
          initContainers:
            - name: recreate-databases
              image: postgres:16.6-alpine
              envFrom: [{ secretRef: { name: postgres-credentials } }]
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: postgres }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  for db in insurehub payments notifications claimguard lendhub insureassist; do
                    psql -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$db';" >/dev/null
                    psql -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $db;" -c "CREATE DATABASE $db OWNER $db;"
                  done
              resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          containers:
            - name: restart-apps
              image: bitnami/kubectl:1.31
              securityContext: { runAsUser: 1001, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  for ns in insurehub integrations claimguard lendhub insureassist insurehub-ussd; do
                    kubectl -n "$ns" rollout restart deployment --selector=app.kubernetes.io/part-of=insurehub || true
                  done
              resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 128Mi } }
