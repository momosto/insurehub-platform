# Per-namespace guardrails for every app namespace (generated by kustomize from this template via replacements
# would be overkill here; the six app namespaces are listed explicitly so the rendered output is easy to review).
# Default deny ingress + allow from Traefik (kube-system) and from inside the namespace; quotas and default limits.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: lendhub }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller-and-same-namespace, namespace: lendhub }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: insureassist }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller-to-agent, namespace: insureassist }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: insureassist-agent } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
    # USSD and other channels post call-back events to the agent
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: insurehub-ussd } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: insurehub-ussd }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller, namespace: insurehub-ussd }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: insurehub }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller-and-callers, namespace: insurehub }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        # channel and partner calls: payments callbacks, LendHub credit life, InsureAssist MCP, USSD
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: integrations } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: lendhub } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: insureassist } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: insurehub-ussd } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: integrations }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller-and-callers, namespace: integrations }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - podSelector: {}
        - namespaceSelector: { matchLabels: { insurehub/tier: app } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: claimguard }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller, namespace: claimguard }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }] }]
---
# Shared data services accept connections only from app namespaces (and backups from inside "data")
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apps-only, namespace: data }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { insurehub/tier: app } }
        - podSelector: {}
---
# The OTel collector receives OTLP from apps only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-otlp-from-apps, namespace: observability }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { insurehub/tier: app } } }]
      ports: [{ port: 4317 }, { port: 4318 }]
