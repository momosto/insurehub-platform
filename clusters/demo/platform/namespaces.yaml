  labels: { insurehub/tier: app, pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: lendhub
  labels: { insurehub/tier: app, pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: insureassist
  labels: { insurehub/tier: app, pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
