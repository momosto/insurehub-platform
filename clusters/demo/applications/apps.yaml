# InsureHub and ClaimGuard get their deploy/ folders in their own deploy-week work (see each NEXT_STEPS.md).
# Until then these Applications show as "missing path" in ArgoCD, which is the intended reminder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: insurehub
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: insurehub
  source: { repoURL: https://github.com/momosto/insurehub, targetRevision: main, path: deploy/base }
  destination: { server: https://kubernetes.default.svc, namespace: insurehub }
  syncPolicy: { automated: { prune: true, selfHeal: true } }
---
