# Business systems (sync wave 0). Each points at the app repo's deploy/ folder; the image tag lives HERE, so the
# environment is reproducible from this repo alone and a rollback is a revert of one line (PF-03).
# The tag bump bot (.github/workflows/bump-image.yml) edits the `newTag` values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lendhub
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: insurehub
  source:
    repoURL: https://github.com/momosto/lendhub
    targetRevision: main
    path: deploy/overlays/demo
    kustomize:
      images:
        - ghcr.io/momosto/lendhub-api:0.1.0
        - ghcr.io/momosto/lendhub-web:0.1.0
  destination: { server: https://kubernetes.default.svc, namespace: lendhub }
  syncPolicy: { automated: { prune: true, selfHeal: true } }
---
