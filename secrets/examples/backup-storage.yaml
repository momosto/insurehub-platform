# OCI Object Storage S3-compatible keys ("Customer secret keys" in the console); bucket from terraform output
apiVersion: v1
kind: Secret
metadata: { name: backup-storage, namespace: data }
type: Opaque
stringData:
  S3_ENDPOINT: https://<namespace>.compat.objectstorage.<region>.oraclecloud.com
  BACKUP_BUCKET: insurehub-backups
  AWS_ACCESS_KEY_ID: change-me
  AWS_SECRET_ACCESS_KEY: change-me
