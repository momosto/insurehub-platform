# Copy to ../postgres-credentials.enc.yaml, fill in, then: sops --encrypt --in-place secrets/postgres-credentials.enc.yaml
apiVersion: v1
kind: Secret
metadata: { name: postgres-credentials, namespace: data }
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me-32-random-characters
  # one login per service database; names must match the loop in clusters/demo/infra/postgres.yaml
  INSUREHUB_PASSWORD: change-me
  PAYMENTS_PASSWORD: change-me
  NOTIFICATIONS_PASSWORD: change-me
  CLAIMGUARD_PASSWORD: change-me
  LENDHUB_PASSWORD: change-me
  INSUREASSIST_PASSWORD: change-me
