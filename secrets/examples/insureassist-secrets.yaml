apiVersion: v1
kind: Secret
metadata: { name: insureassist-secrets, namespace: insureassist }
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""          # empty = deterministic planner only
  IA_DATABASE_URL: postgresql+psycopg://insureassist:change-me@postgres.data.svc:5432/insureassist
  IA_DELEGATED_TOKEN_SECRET: change-me-at-least-32-bytes
  IA_EVENTS_SHARED_SECRET: change-me
  IA_WHATSAPP_APP_SECRET: ""
  IA_WHATSAPP_VERIFY_TOKEN: ""
  IA_WHATSAPP_ACCESS_TOKEN: ""
  IA_INBOX_PASSWORD: change-me
