# ArgoCD app "secrets" builds this folder. KSOPS decrypts each *.enc.yaml listed in secret-generator.yaml with the
# age key mounted into the repo server. Until the encrypted files exist the generator stays commented out, so the
# app syncs empty instead of failing (scripts/bootstrap-cluster.sh creates them from examples/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
