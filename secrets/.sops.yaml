# SOPS rules for this folder (ADR-0003). Only the values under data/stringData are encrypted, so diffs stay readable.
# Replace the recipient with the public key printed by `age-keygen` (scripts/bootstrap-cluster.sh explains where the
# private key lives). The private key is never committed: .gitignore blocks keys.txt and *.age.
creation_rules:
  - path_regex: secrets/.*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1examplepublickeyreplacewithyourownqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq
